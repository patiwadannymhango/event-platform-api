name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_SSH_USER }}
          key: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ${{ secrets.AWS_PROJECT_PATH }}
            git pull origin main
            # --env-file is required: compose only auto-loads `.env`, and the
            # DB credentials + frontend build args live in `.env.prod`.
            # Without it the frontends rebuild with an empty
            # VITE_API_BASE_URL and silently fall back to localhost:8000.
            docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
            docker image prune -f
