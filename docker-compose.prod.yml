name: copperbelt-marathon

services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not exposed to the host on purpose — only reachable by other
    # containers on the compose network.

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media

  # This stack is backend-only now — neither frontend is built or served
  # here. Both the public registration site AND the admin dashboard
  # deploy separately on Vercel as standalone Vite apps (see the root
  # README's "Deploying to Vercel" sections). They talk to this backend
  # over real cross-origin requests, so CORS_ALLOWED_ORIGINS in
  # backend/.env must include both their Vercel domains.
  #
  # Caddy fronts the API on a single port — no domain and no DNS
  # required (see the Caddyfile). Only port 80 needs to be open in your
  # AWS security group / firewall.
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - static_files:/srv/static:ro
      - media_files:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  db_data:
  static_files:
  media_files:
  caddy_data:
  caddy_config:
